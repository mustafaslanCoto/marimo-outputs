# This workflow builds and deploys marimo notebooks to GitHub Pages

name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: 🛠️ Export notebooks
        run: |
          uv run .github/scripts/build.py
          
          # 🚨 DYNAMIC CSS INJECTION FROM NEW FOLDERS 🚨
          python -c '
          import os, re
          
          for root, _, files in os.walk("_site"):
              for file in files:
                  if file.endswith(".html"):
                      html_path = os.path.join(root, file)
                      app_name = file.replace(".html", "")
                      
                      # 1. Look for CSS in the new css folders (checks both apps/css and root css)
                      css_candidates = [f"apps/css/{app_name}.css", f"css/{app_name}.css", "apps/css/custom.css", "css/custom.css"]
                      css_content = ""
                      for css_path in css_candidates:
                          if os.path.exists(css_path):
                              with open(css_path, "r", encoding="utf-8") as f:
                                  css_content = f.read()
                              break
                              
                      if css_content:
                          style_block = f"\n<style>\n{css_content}\n</style>\n"
                      else:
                          style_block = ""
                          
                      # 2. Inject CSS and strip CSP
                      with open(html_path, "r", encoding="utf-8") as f:
                          html = f.read()
                          
                      html = re.sub(r"<meta[^>]*content-security-policy[^>]*>", "", html, flags=re.IGNORECASE)
                      
                      if style_block:
                          if "</head>" in html:
                              html = html.replace("</head>", style_block + "</head>")
                          else:
                              html += style_block
                              
                      with open(html_path, "w", encoding="utf-8") as f:
                          f.write(html)
          '
          
          # Create apps directory for final deployment
          mkdir -p _site/apps
          
          # Copy images and assets
          cp -r apps/images _site/apps/ 2>/dev/null || true
          cp -r apps/public _site/apps/ 2>/dev/null || true
          
          # 🚨 CRITICAL FIX: Copy the new html and css folders to the deployment site
          cp -r apps/html _site/apps/ 2>/dev/null || true
          cp -r apps/css _site/apps/ 2>/dev/null || true
          
          # (Fallback rules just in case you put the folders in the root instead of apps/)
          cp -r html _site/apps/ 2>/dev/null || true
          cp -r css _site/apps/ 2>/dev/null || true

          tree _site
    
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4