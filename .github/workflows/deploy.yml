# This workflow builds and deploys marimo notebooks to GitHub Pages
# It runs automatically when changes are pushed to the main branch or can be triggered manually

name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: 🛠️ Export notebooks
        run: |
          uv run .github/scripts/build.py
          
          # 🚨 INJECT CSS DIRECTLY & AGGRESSIVELY STRIP CSP 🚨
          # This reads your custom.css and bakes it straight into the HTML
          # avoiding all network paths and strict security blocks.
          python -c '
          import os, re
          
          # 1. Find and read the CSS file
          css_path = "apps/custom.css" if os.path.exists("apps/custom.css") else "custom.css"
          try:
              with open(css_path, "r", encoding="utf-8") as f:
                  css_content = f.read()
          except Exception as e:
              css_content = "/* CSS load failed */"
              
          style_block = f"\n<style>\n{css_content}\n</style>\n"
          
          # 2. Inject CSS and strip CSP from every exported HTML file
          for root, _, files in os.walk("_site"):
              for file in files:
                  if file.endswith(".html"):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f:
                          html = f.read()
                          
                      # Strip CSP tag (case-insensitive to ensure it catches it)
                      html = re.sub(r"<meta[^>]*content-security-policy[^>]*>", "", html, flags=re.IGNORECASE)
                      
                      # Inject styles right before the closing head tag
                      if "</head>" in html:
                          html = html.replace("</head>", style_block + "</head>")
                      else:
                          html += style_block
                          
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(html)
          '
          
          # Copy images and assets to root
          cp -r apps/images _site/ 2>/dev/null || true
          cp -r apps/public _site/ 2>/dev/null || true
          cp apps/title-slide.html _site/ 2>/dev/null || true
          
          # 🚨 CRITICAL FIX: Copy assets to the apps/ folder so notebook can fetch them!
          mkdir -p _site/apps
          cp -r apps/images _site/apps/ 2>/dev/null || true
          cp -r apps/public _site/apps/ 2>/dev/null || true
          cp apps/title-slide.html _site/apps/ 2>/dev/null || true

          tree _site
    
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4